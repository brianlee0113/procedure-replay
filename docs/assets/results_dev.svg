<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Step hit F1: ProcedureReplay vs. cutting the video into equal parts</title>
<desc id="d">PC repair: 0.44 vs 0.25, better on 30 of 32 videos; Drill bit: 0.57 vs 0.37, better on 23 of 35 videos; Omelet: 0.39 vs 0.15, better on 7 of 9 videos</desc>
<style>
  .bg{fill:#ffffff} .ink{fill:#1b1b1f} .mute{fill:#6b6b74} .grid{stroke:#e6e6e2}
  .ours{fill:#2f5bd3} .base{fill:#c4c4cc} .oursv{fill:#2f5bd3}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117} .ink{fill:#e6edf3} .mute{fill:#9198a1} .grid{stroke:#262b33}
    .ours{fill:#6f8cff} .base{fill:#4a4f58} .oursv{fill:#8ea5ff}
  }
</style>
<rect class="bg" width="760" height="360" rx="12"/>
<text class="ink" x="24" y="36" font-size="19" font-weight="700">How many of the expert's steps the guide gets right</text>
<text class="mute" x="24" y="60" font-size="13">dev set · hit = covers at least half of an expert-labelled step, clip not padded, judge sees the same action</text>
<rect class="ours" x="190" y="72" width="12" height="12" rx="3"/>
<text class="ink" x="208" y="82.5" font-size="12.5">ProcedureReplay (Muse Spark)</text>
<rect class="base" x="400" y="72" width="12" height="12" rx="3"/>
<text class="ink" x="418" y="82.5" font-size="12.5">Equal-length cuts + captions</text>
<line class="grid" x1="190.0" y1="100" x2="190.0" y2="314" stroke-width="1"/>
<text class="mute" x="190.0" y="332" font-size="11.5" text-anchor="middle">0</text>
<line class="grid" x1="302.5" y1="100" x2="302.5" y2="314" stroke-width="1"/>
<text class="mute" x="302.5" y="332" font-size="11.5" text-anchor="middle">0.25</text>
<line class="grid" x1="415.0" y1="100" x2="415.0" y2="314" stroke-width="1"/>
<text class="mute" x="415.0" y="332" font-size="11.5" text-anchor="middle">0.5</text>
<line class="grid" x1="527.5" y1="100" x2="527.5" y2="314" stroke-width="1"/>
<text class="mute" x="527.5" y="332" font-size="11.5" text-anchor="middle">0.75</text>
<line class="grid" x1="640.0" y1="100" x2="640.0" y2="314" stroke-width="1"/>
<text class="mute" x="640.0" y="332" font-size="11.5" text-anchor="middle">1</text>
<text class="mute" x="415.0" y="350" font-size="11.5" text-anchor="middle">step hit F1 (0–1)</text>
<text class="ink" x="24" y="126" font-size="14.5" font-weight="600">PC repair</text>
<text class="mute" x="24" y="153" font-size="12">32 videos × 3 runs</text>
<rect class="ours" x="190" y="108" width="198.0" height="22" rx="4"/>
<text class="oursv" x="396.0" y="124" font-size="14" font-weight="700">0.44</text>
<rect class="base" x="190" y="136" width="112.5" height="22" rx="4"/>
<text class="mute" x="310.5" y="152" font-size="13">0.25</text>
<text class="ink" x="736" y="132" font-size="13" text-anchor="end">better on</text>
<text class="ink" x="736" y="149" font-size="13" font-weight="700" text-anchor="end">30/32 videos</text>
<text class="ink" x="24" y="200" font-size="14.5" font-weight="600">Drill bit</text>
<text class="mute" x="24" y="227" font-size="12">35 videos × 3 runs</text>
<rect class="ours" x="190" y="182" width="256.5" height="22" rx="4"/>
<text class="oursv" x="454.5" y="198" font-size="14" font-weight="700">0.57</text>
<rect class="base" x="190" y="210" width="166.5" height="22" rx="4"/>
<text class="mute" x="364.5" y="226" font-size="13">0.37</text>
<text class="ink" x="736" y="206" font-size="13" text-anchor="end">better on</text>
<text class="ink" x="736" y="223" font-size="13" font-weight="700" text-anchor="end">23/35 videos</text>
<text class="ink" x="24" y="274" font-size="14.5" font-weight="600">Omelet</text>
<text class="mute" x="24" y="301" font-size="12">9 videos × 3 runs</text>
<rect class="ours" x="190" y="256" width="175.5" height="22" rx="4"/>
<text class="oursv" x="373.5" y="272" font-size="14" font-weight="700">0.39</text>
<rect class="base" x="190" y="284" width="67.5" height="22" rx="4"/>
<text class="mute" x="265.5" y="300" font-size="13">0.15</text>
<text class="ink" x="736" y="280" font-size="13" text-anchor="end">better on</text>
<text class="ink" x="736" y="297" font-size="13" font-weight="700" text-anchor="end">7/9 videos</text>
</svg>
