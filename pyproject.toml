[project]
name = "procedure-replay"
version = "0.1.0"
description = "Learn a manual procedure from one reference video, then flag skipped or out-of-order steps in another person's video."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.4.6",
    "openai>=3.38.0",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pr"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
