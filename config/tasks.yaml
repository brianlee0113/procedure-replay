# Per task: SAM 3.1 concept prompts, the expected steps, and where the footage comes from.
# SAM 3.1 takes ONE short noun phrase per request (no lists, commands, or questions),
# so each prompt costs one request per video (billed per frame of the 5 fps proxy).
#
# Footage (see README "Data"):
# - factory: IndEgo (Fraunhofer IPK, NeurIPS 2025), Project Aria glasses, CC BY 4.0.
#   https://huggingface.co/datasets/FraunhoferIPK/IndEgo  — Mistake_Detection/Task_<N>/mp4_480/
# - home: CaptainCook4D (UT Dallas, NeurIPS 2024), head-mounted GoPro, Apache-2.0.
#   https://github.com/CaptainCook4D  — recipes have a partial order (data/task_graphs/<task>.json).
# `keysteps` are the dataset's human step labels, in the order the reference take does them.
# `reference` is the correct take used to build the Guide; every other take is a trainee.

pc_repair:
  name: Repairing a PC (install parts, clean, close, test)
  indego_task: 22
  reference: 22_u17_r03_c_01        # ~8 min, every keystep labelled
  expected_steps: 9
  keysteps: [open pc, add battery, add ram, attach hard disk, attach fan, attach power, clean, close pc, test]
  object_prompts:
    - computer case
    - RAM stick
    - hard disk drive
    - cooling fan
    - coin cell battery
    - power cable

drill_bit:
  name: Changing a drill bit
  indego_task: 7
  reference: 07_u01_r02_c_01        # ~50 s
  expected_steps: 5
  keysteps: [unplug, remove bit, insert bit, plug in, test]
  object_prompts:
    - electric drill
    - drill bit
    - power cord                     # 'power plug' found nothing in the smoke test

home_cooking:
  name: Herb omelet with fried tomatoes (home kitchen)
  captaincook_activity: Herb Omelet with Fried Tomatoes
  reference: cc4d_22_21              # ~12 min, normal take that follows the recipe graph (22_8 heats the pan too early)
  expected_steps: 15
  keysteps:
    - take a tomato
    - chop 2 tbsp cilantro
    - crack one egg in a bowl
    - cut tomato into two pieces
    - add the chopped cilantro to the bowl
    - add 1/2 tsp ground black pepper to the bowl
    - beat the contents of the bowl
    - heat 1 tbsp oil in a non-stick frying pan
    - cook the tomatoes cut-side down until they start to soften and colour
    - scoop the tomatoes from the pan
    - put tomatoes on a serving plate
    - pour the egg mixture into the pan
    - stir gently with a wooden spoon so the egg that sets on the base of the pan moves to enable the uncooked egg to flow into the space
    - stop stirring when it's nearly cooked to allow it to set into an omelette
    - transfer omelette to the plate and serve with the tomatoes
  object_prompts:
    - frying pan
    - tomato
    - egg
    - bowl                           # 'mixing bowl' found nothing; 'bowl' 97% (smoke test)
    - cutting board
    - wooden spoon
    - plate

# Not used for evaluation: correct takes revisit steps (vertical bar -> holder bar -> vertical bar),
# which would read as out-of-order. Kept so it can be switched back on.
camera_stand:
  name: Assembling a camera stand
  indego_task: 23
  reference: 23_u14_r04_c_01
  expected_steps: 4
  keysteps: [attach vertical bar, attach holder bar, attach camera, inspect]
  object_prompts:
    - camera stand
    - camera
    - metal bar
